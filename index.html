<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My First Firebase Website</title>
</head>

<body>

    <h1>Welcome to Firebase</h1>

    <p id="connection">Connecting to Firebase...</p>

    <h2>Create an Account</h2>

    <form id="registerForm">

        <input
            type="text"
            id="name"
            placeholder="Full Name"
            required
        >

        <br><br>

        <input
            type="email"
            id="email"
            placeholder="Email Address"
            required
        >

        <br><br>

        <input
            type="password"
            id="password"
            placeholder="Password"
            minlength="6"
            required
        >

        <br><br>

        <button type="submit">Register</button>

    </form>

    <p id="message"></p>
    
    <h2>Member Information</h2>

<button id="loadMember">Load Member</button>

<div id="memberDetails"></div>
    
    <h2>All Members</h2>

<button id="loadMembers">Load All Members</button>

<div id="allMembers"></div>
<h2>Add New Member</h2>

<form id="memberForm">

    <input
        type="text"
        id="memberName"
        placeholder="Member Name"
        required
    >

    <br><br>

    <input
        type="email"
        id="memberEmail"
        placeholder="Member Email"
        required
    >

    <br><br>

    <input
        type="number"
        id="memberAge"
        placeholder="Member Age"
        required
    >

    <br><br>

    <button type="submit">Save Member</button>

</form>

<p id="saveMessage"></p>

    <script type="module">

    import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

    import {
        getAuth,
        createUserWithEmailAndPassword,
        updateProfile
    } from
    "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

    import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    collection,
    getDocs
} from
"https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";

    const firebaseConfig = {

        apiKey: "AIzaSyDRlfWyjO6Yg1lTFlZDQzJcOGor1XgBUY",

        authDomain:
        "fir-learning-project-25a55.firebaseapp.com",

        projectId:
        "fir-learning-project-25a55",

        storageBucket:
        "fir-learning-project-25a55.firebasestorage.app",

        messagingSenderId:
        "28462227355",

        appId:
        "1:28462227355:web:c78a76ccc65f8fd9f1cb3e",

        measurementId:
        "G-BK28KXWZ14"
    };


    // Connect Firebase

    const app = initializeApp(firebaseConfig);


    // Connect Authentication

    const auth = getAuth(app);


    // Connect Firestore Database

    const db = getFirestore(app);
        
        const memberForm =
    document.getElementById("memberForm");

const saveMessage =
    document.getElementById("saveMessage");

    // Registration form

    const registerForm =
        document.getElementById("registerForm");

    const message =
        document.getElementById("message");


    registerForm.addEventListener("submit", async (e) => {

        e.preventDefault();


        const name =
            document.getElementById("name").value;

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;


        try {

            const userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            await updateProfile(
                userCredential.user,
                {
                    displayName: name
                }
            );


            message.textContent =
                "Registration successful!";

            registerForm.reset();


        } catch (error) {

            message.textContent =
                error.message;

        }

    });


    // Load member from Firestore

    const loadMember =
        document.getElementById("loadMember");

    const memberDetails =
        document.getElementById("memberDetails");


    loadMember.addEventListener("click", async () => {

        try {

            const memberRef =
                doc(db, "members", "member001");


            const memberSnap =
                await getDoc(memberRef);


            if (memberSnap.exists()) {

                const member =
                    memberSnap.data();


                memberDetails.innerHTML = `
                    <p>Name: ${member.name}</p>
                    <p>Email: ${member.Email}</p>
                    <p>Age: ${member.Age}</p>
                `;

            } else {

                memberDetails.textContent =
                    "Member not found.";

            }

        } catch (error) {

            memberDetails.textContent =
                "Error: " + error.message;

        }

    });
        memberForm.addEventListener("submit", async (e) => {

    e.preventDefault();

    const name =
        document.getElementById("memberName").value;

    const email =
        document.getElementById("memberEmail").value;

    const age =
        Number(document.getElementById("memberAge").value);

    try {

        const newMemberRef =
            doc(db, "members", "member002");

        await setDoc(newMemberRef, {
            Name: name,
            Email: email,
            Age: age
        });

        saveMessage.textContent =
            "Member saved successfully!";

        memberForm.reset();

    } catch (error) {

        saveMessage.textContent =
            "Error: " + error.message;

    }

});
        const loadMembers =
    document.getElementById("loadMembers");

const allMembers =
    document.getElementById("allMembers");


loadMembers.addEventListener("click", async () => {

    try {

        const membersRef =
            collection(db, "members");

        const membersSnapshot =
            await getDocs(membersRef);

        allMembers.innerHTML = "";

        membersSnapshot.forEach((memberDoc) => {

            const member =
                memberDoc.data();

            allMembers.innerHTML += `
                <div>
                    <p>Name: ${member.Name}</p>
                    <p>Email: ${member.Email}</p>
                    <p>Age: ${member.Age}</p>
                    <hr>
                </div>
            `;
        });

    } catch (error) {

        allMembers.textContent =
            "Error: " + error.message;

    }

});


    // Firebase connection message

    document.getElementById("connection").textContent =
        "Firebase connected successfully!";

    </script>
